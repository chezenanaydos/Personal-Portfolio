<!DOCTYPE html>
<html lang="en">

<!-- Head -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>My Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>

    <!-- Basic Icons -->
    <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
    <!-- Filled Icons -->
    <link href="https://cdn.boxicons.com/3.0.8/fonts/filled/boxicons-filled.min.css" rel="stylesheet">
    <!-- Brand Icons -->

    <link href="https://cdn.boxicons.com/3.0.8/fonts/brands/boxicons-brands.min.css" rel="stylesheet">
</head>

<!-- Body -->

<body>

    <!-- Navigation -->
    <nav id="navigation">

        <!-- Main Navigation (Top) -->
        <div class="navigation-buttons">
            <ul>
                <a class="logo" href="#home" onclick="showPage('home')"> Chezen Anaydos </a>
                <li><a href="#projects" onclick="showPage('projects')">Projects</a></li>
                <li><a href="#stack" onclick="showPage('stack')">Stack</a></li>
                <li><a href="#certifications" onclick="showPage('certifications')">Certifications</a></li>
            </ul>
        </div>

        <!-- Nav Separator -->
        <div class="separator"></div>

        <!-- Social Information Navigation -->
        <div class="navigation-buttons">
            <ul>
                <li><a href="https://github.com" target="_blank">GitHub</a></li>
                <li><a href="https://linkedin.com" target="_blank">LinkedIn</a></li>
            </ul>

        </div>

        <!-- Nav Separator -->
        <div class="separator"></div>

        <!-- Personal Navigation-->
        <div class="navigation-buttons">
            <ul>
                <li><a href="#blog" onclick="showPage('blog')">Blog</a></li>
                <li><a href="#gear" onclick="showPage('gear')">Gear</a></li>
            </ul>
        </div>

        <!-- Nav Separator -->
        <div class="separator"></div>

        <!-- Website Editor-->
        <div class="editor">

            <!-- Theme Toggle (1 Oval) -->
            <div class="oval-group">

                <button class="theme-btn">
                    <i class="bx bx-devices"></i>
                </button>

                <button class="theme-btn" id="theme-toggle" title="Theme (Light/Dark/System)" aria-label="Toggle Theme">
                    <i class="bx bx-moon"></i>
                </button>

                <button class="theme-btn">
                    <i class="bx bx-sun-dim"></i>
                </button>

            </div>


            <!-- Volume & Settings (1 Oval / Pill) -->
            <div class="oval-group">
                <button class="icon-btn volume-btn" id="volume-toggle" title="Sound Volume" aria-label="Volume">
                    <i class="bx bx-volume-full"></i>
                </button>
                <button class="icon-btn settings-btn" id="settings-toggle" title="Settings" aria-label="Settings">
                    <i class="bx bx-cog"></i>
                </button>
            </div>

        </div>
    </nav>

    <!-- Home -->
    <section id="home" class="page active">


        <!-- My Image-->
        <div id="self-portrait">
            <img src="my-image.jpg" alt="Self Portrait">
        </div>

        <div class="home-content">
            <h1>Chezen Anaydos</h1>
            <h3>-Introduction</h3>
            <p>I'm a passionate Web Developer with interests in Game Development.</p>
        </div>


    </section>

    <!-- About -->
    <section id="about" class="page">

        <!-- Title Page for About -->
        <div class="page-title">
            <h1>About Me</h1>
            <p>Learn more about my background and experience.</p>
        </div>

    </section>

    <!-- Projects -->
    <section id="projects" class="page">

    </section>

    <!-- Certifications -->
    <section id="certifications" class="page">

    </section>

    <!-- Stack -->
    <section id="stack" class="page">

    </section>

    <!-- Blog -->
    <section id="blog" class="page">

    </section>

    <!-- Gear -->
    <section id="gear" class="page">
    </section>

    <!-- Website Editor -->
    <div id="theme">

    </div>
</body>


</html>
